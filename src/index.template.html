<!doctype html>
<html lang="zh" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F6F4EF">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121110">
<title>Background Radio</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<!--ICONS_SPRITE-->

<div class="shell">
  <header class="top-bar">
    <div class="status">
      <div id="nowTitle" class="status-track">Radio</div>
      <div id="statusScope" class="status-scope"></div>
    </div>
    <button id="cloudBtn" class="menu-btn icon-btn" aria-label="云端" title="云端（未登录点=登录；已登录点=刷新列表）">
      <svg class="ic"><use id="cloudIcon" href="#cloud-unavailable"/></svg>
      <svg class="ic cloud-spin" id="cloudSpin" hidden><use href="#cloud-busy-spinner"/></svg>
    </button>
    <button id="menuToggle" class="menu-btn" aria-label="菜单" title="菜单"><span></span><span></span><span></span></button>
  </header>

  <main>
    <section class="browser">
      <button id="resumeBtn" class="resume-row" hidden></button>
      <div id="status"></div>
      <div id="list" class="entry-list"></div>
    </section>

    <section class="seek">
      <span id="posCur" class="time">0:00</span>
      <div id="progressWrap" aria-label="进度"><div id="progressBar"></div></div>
      <span id="posDur" class="time">0:00</span>
    </section>

    <section class="controls">
      <div class="ctrl-col">
        <button id="rewindBtn" class="ctrl-cell" aria-label="回退 10 秒"><span class="ctrl-glyph">«</span><span class="ctrl-sub">10s</span></button>
        <button id="prevBtn" class="ctrl-cell" aria-label="上一曲"><svg class="ic"><use href="#skip-prev"/></svg></button>
      </div>
      <button id="bigPlay" class="ctrl-play-big" aria-label="播放/暂停"><svg class="ic-big"><use id="bigPlayIcon" href="#play"/></svg></button>
      <div class="ctrl-col">
        <button id="forwardBtn" class="ctrl-cell" aria-label="前进 30 秒"><span class="ctrl-glyph">»</span><span class="ctrl-sub">30s</span></button>
        <button id="nextBtn" class="ctrl-cell" aria-label="下一曲"><svg class="ic"><use href="#skip-next"/></svg></button>
      </div>
      <div class="vol-strip">
        <svg class="vol-icon ic"><use href="#volume"/></svg>
        <input type="range" id="volumeBar" class="vol-vert" min="0" max="100" value="80" step="1" orient="vertical" aria-label="音量">
      </div>
    </section>
  </main>
</div>

<div id="menuBackdrop" class="menu-backdrop" aria-hidden="true"></div>
<aside id="menuDrawer" class="menu-drawer" aria-hidden="true" aria-label="菜单">
  <header class="menu-head">
    <h2>菜单 <span id="ver"></span></h2>
    <button id="menuClose" class="menu-x" aria-label="关闭菜单">✕</button>
  </header>
  <section class="menu-section">
    <h3>账号</h3>
    <div id="cloudWho" class="user-name">未登录——点顶栏云按钮登录</div>
    <div class="menu-row"><button id="authBtn" class="ghost" hidden>登出</button></div>
  </section>
  <section class="menu-section">
    <h3>主题</h3>
    <div class="loop-row">
      <label class="loop-opt"><input type="radio" name="theme" value="auto" checked> <span>跟随系统</span></label>
      <label class="loop-opt"><input type="radio" name="theme" value="day"> <span>白金 · 日</span></label>
      <label class="loop-opt"><input type="radio" name="theme" value="night"> <span>黑金 · 夜</span></label>
    </div>
  </section>
  <section class="menu-section">
    <h3>循环模式</h3>
    <div class="loop-row">
      <label class="loop-opt"><input type="radio" name="loop" value="folder"> <span>顺序循环</span></label>
      <label class="loop-opt"><input type="radio" name="loop" value="single"> <span>单曲循环</span></label>
    </div>
  </section>
  <section class="menu-section">
    <h3>本地缓存</h3>
    <div id="usageNote" class="cache-info">—</div>
  </section>
  <details class="menu-section menu-debug">
    <summary>调试日志</summary>
    <div id="log"></div>
  </details>
</aside>

<audio id="audio" playsinline></audio>
<script type="module" src="./app.js"></script>
</body>
</html>
