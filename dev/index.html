<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F6F4EF">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="./style.css">
</head>
<body>

  <symbol id="cloud-pending" data-cat="cloud" data-src="own" data-note="待判定:虚线云 + 云内问号(加粗 2.4, 遮罩描边留白与云脱开;问号下点的半径=描边半宽)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><mask id="icQC"><rect width="24" height="24" fill="#fff" stroke="none"/><g transform="translate(-6.00 -8.10) scale(1.500)" stroke="#000" fill="#000" stroke-width="3.33" stroke-linecap="round"><path d="M10.2 12.1a1.9 1.9 0 1 1 2.6 1.75c-.55.25-.8.7-.8 1.35v.4" fill="none"/><circle cx="12" cy="17.5" r="1.67" stroke="none"/></g></mask><g mask="url(#icQC)"><g transform="translate(0 0) scale(1.0)" stroke-width="1.70"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z" stroke-dasharray="2.50 2.50"/></g></g><g transform="translate(-6.00 -8.10) scale(1.500)" stroke-width="1.60"><path d="M10.2 12.1a1.9 1.9 0 1 1 2.6 1.75c-.55.25-.8.7-.8 1.35v.4"/><circle cx="12" cy="17.5" r="0.80" fill="currentColor" stroke="none"/></g></symbol>

  <symbol id="cloud-busy-base" data-cat="cloud" data-src="own" data-note="云端忙 静态件:云轮廓中心挖圆洞, 与 cloud-busy-spinner 叠放合成一个资产" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><mask id="icCBB"><rect width="24" height="24" fill="#fff" stroke="none"/><circle cx="12" cy="12" r="4.9" fill="#000" stroke="none"/></mask><g mask="url(#icCBB)"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></g></symbol>
  <!-- cloud-busy-spinner — 云端忙 旋转件:弧+箭头, 圆心正在 (12,12) 所以 CSS rotate 原地转不甩 -->
  <symbol id="cloud-busy-spinner" data-cat="cloud" data-src="own" data-note="云端忙 旋转件:弧+箭头, 圆心正在 (12,12) 所以 CSS rotate 原地转不甩" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12.00 8.70 A3.3 3.3 0 1 1 8.90 13.13"/><path d="M10.66 14.61 L8.90 13.13 L8.50 15.39"/></symbol>

  <symbol id="refresh" data-cat="cloud" data-src="own" data-note="刷新:顺时针 3/4 圆 + 箭头(从 12 点绕到 9 点, 箭头尖在右上)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><!-- 顺时针 3/4 圆 + 箭头：从 12 点出发顺时针绕到 9 点；箭头尖在右上 --> <path d="M21 12a9 9 0 1 1-3.5-7.1"/> <polyline points="21 4 21 9 16 9"/></symbol>

  <symbol data-missing="1" id="skip-next" data-cat="missing" data-src="own" data-note="缺图标占位 — skip-next 尚未进 icons.svg，重跑 extract-icons.py 可自动换成真图标" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2.5" stroke-dasharray="2.5 2.5" opacity="0.35"/></symbol>
  <!-- repeat-one — 缺图标占位 — repeat-one 尚未进 icons.svg -->
  <symbol data-missing="1" id="repeat-one" data-cat="missing" data-src="own" data-note="缺图标占位 — repeat-one 尚未进 icons.svg，重跑 extract-icons.py 可自动换成真图标" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2.5" stroke-dasharray="2.5 2.5" opacity="0.35"/></symbol>

<header>
  <h1>背景电台 <span id="ver"></span></h1>
  <button id="cloudBtn" class="iconbtn" aria-label="云端菜单"><svg class="ic"><use href="#cloud-pending"/></svg></button>
</header>
<div id="cloudMenu" hidden>
  <div id="cloudWho" class="menu-note">未登录</div>
  <button id="authBtn"><svg class="ic"><use href="#sign-out"/></svg><span id="authLabel">登录</span></button>
  <button id="refreshBtn"><svg class="ic"><use href="#refresh"/></svg>刷新列表</button>
  <div id="usageNote" class="menu-note"></div>
</div>
<main>
  <section id="nowPlaying">
    <div id="nowTitle">未在播放</div>
    <div id="progressWrap"><div id="progressBar"></div></div>
    <div id="timeLabel"></div>
    <div id="controls">
      <button id="bigPlay" class="bigbtn" aria-label="播放/暂停"><svg class="ic-big"><use id="bigPlayIcon" href="#play"/></svg></button>
      <button id="nextBtn" class="ctlbtn" aria-label="下一曲"><svg class="ic"><use href="#skip-next"/></svg><span>下一曲</span></button>
      <button id="modeBtn" class="ctlbtn" aria-label="播放模式"><svg class="ic"><use href="#repeat-one"/></svg><span id="modeLabel">顺序循环</span></button>
    </div>
    <button id="resumeBtn" hidden></button>
  </section>
  <div id="status"></div>
  <section id="list"></section>
</main>
<details id="debug"><summary>调试日志</summary><div id="log"></div></details>
<audio id="audio" playsinline></audio>
<script type="module" src="./app.js"></script>
</body>
</html>
