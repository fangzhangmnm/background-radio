<!doctype html>
<html lang="zh" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F6F4EF">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121110">
<title>Background Radio</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- back — 返回:左向整箭头(带杆;裸 chevron-left 曾因小尺寸渲染差被 sunset) -->

  <symbol id="cloud-pending" data-cat="cloud" data-src="own" data-note="待判定:虚线云 + 云内问号(加粗 2.4, 遮罩描边留白与云脱开;问号下点的半径=描边半宽)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><mask id="icQC"><rect width="24" height="24" fill="#fff" stroke="none"/><g transform="translate(-6.00 -8.10) scale(1.500)" stroke="#000" fill="#000" stroke-width="3.33" stroke-linecap="round"><path d="M10.2 12.1a1.9 1.9 0 1 1 2.6 1.75c-.55.25-.8.7-.8 1.35v.4" fill="none"/><circle cx="12" cy="17.5" r="1.67" stroke="none"/></g></mask><g mask="url(#icQC)"><g transform="translate(0 0) scale(1.0)" stroke-width="1.70"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z" stroke-dasharray="2.50 2.50"/></g></g><g transform="translate(-6.00 -8.10) scale(1.500)" stroke-width="1.60"><path d="M10.2 12.1a1.9 1.9 0 1 1 2.6 1.75c-.55.25-.8.7-.8 1.35v.4"/><circle cx="12" cy="17.5" r="0.80" fill="currentColor" stroke="none"/></g></symbol>

  <symbol id="cloud-busy-spinner" data-cat="cloud" data-src="own" data-note="云端忙 旋转件:弧+箭头, 圆心正在 (12,12) 所以 CSS rotate 原地转不甩" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12.00 8.70 A3.3 3.3 0 1 1 8.90 13.13"/><path d="M10.66 14.61 L8.90 13.13 L8.50 15.39"/></symbol>

<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!-- BR 本地补丁 sprite（stopgap）：skip-prev / skip-next / volume 尚未进共享图标库（已登记 20260708 SVG Icons/TODO.md）。
       图形 = v1（仓根 index.html）已 ship 的人类认可版走带/喇叭图标，非新画。
       让位协议：build.sh 把本 sprite 内联在共享 sprite 之后——真图入库、重跑 extract 进主 sprite 后，同 id 先到先得自动让位；届时删掉这里对应的 symbol。 -->
  <symbol id="skip-prev" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="6" width="2" height="12"/><polygon points="20,6 9,12 20,18"/></symbol>
  <symbol id="skip-next" viewBox="0 0 24 24" fill="currentColor"><polygon points="4,6 15,12 4,18"/><rect x="17" y="6" width="2" height="12"/></symbol>
  <symbol id="volume" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 4V5L7 9H3zm12 0v6c1.66 0 3-1.34 3-3s-1.34-3-3-3z"/></symbol>
</svg>


<div class="shell">
  <header class="top-bar">
    <div class="status">
      <div id="nowTitle" class="status-track">Radio</div>
      <div id="statusScope" class="status-scope"></div>
    </div>
    <button id="cloudBtn" class="menu-btn icon-btn" aria-label="云端" title="云端（未登录点=登录；已登录点=刷新列表）">
      <svg class="ic"><use id="cloudIcon" href="#cloud-unavailable"/></svg>
      <svg class="ic cloud-spin" id="cloudSpin" hidden><use href="#cloud-busy-spinner"/></svg>
    </button>
    <button id="menuToggle" class="menu-btn" aria-label="菜单" title="菜单"><span></span><span></span><span></span></button>
  </header>

  <main>
    <section class="browser">
      <button id="resumeBtn" class="resume-row" hidden></button>
      <div id="status"></div>
      <div id="list" class="entry-list"></div>
    </section>

    <section class="seek">
      <span id="posCur" class="time">0:00</span>
      <div id="progressWrap" aria-label="进度"><div id="progressBar"></div></div>
      <span id="posDur" class="time">0:00</span>
    </section>

    <section class="controls">
      <div class="ctrl-col">
        <button id="rewindBtn" class="ctrl-cell" aria-label="回退 10 秒"><span class="ctrl-glyph">«</span><span class="ctrl-sub">10s</span></button>
        <button id="prevBtn" class="ctrl-cell" aria-label="上一曲"><svg class="ic"><use href="#skip-prev"/></svg></button>
      </div>
      <button id="bigPlay" class="ctrl-play-big" aria-label="播放/暂停"><svg class="ic-big"><use id="bigPlayIcon" href="#play"/></svg></button>
      <div class="ctrl-col">
        <button id="forwardBtn" class="ctrl-cell" aria-label="前进 30 秒"><span class="ctrl-glyph">»</span><span class="ctrl-sub">30s</span></button>
        <button id="nextBtn" class="ctrl-cell" aria-label="下一曲"><svg class="ic"><use href="#skip-next"/></svg></button>
      </div>
      <div class="vol-strip">
        <svg class="vol-icon ic"><use href="#volume"/></svg>
        <input type="range" id="volumeBar" class="vol-vert" min="0" max="100" value="80" step="1" orient="vertical" aria-label="音量">
      </div>
    </section>
  </main>
</div>

<div id="menuBackdrop" class="menu-backdrop" aria-hidden="true"></div>
<aside id="menuDrawer" class="menu-drawer" aria-hidden="true" aria-label="菜单">
  <header class="menu-head">
    <h2>菜单 <span id="ver"></span></h2>
    <button id="menuClose" class="menu-x" aria-label="关闭菜单">✕</button>
  </header>
  <section class="menu-section">
    <h3>账号</h3>
    <div id="cloudWho" class="user-name">未登录——点顶栏云按钮登录</div>
    <div class="menu-row"><button id="authBtn" class="ghost" hidden>登出</button></div>
  </section>
  <section class="menu-section">
    <h3>主题</h3>
    <div class="loop-row">
      <label class="loop-opt"><input type="radio" name="theme" value="auto" checked> <span>跟随系统</span></label>
      <label class="loop-opt"><input type="radio" name="theme" value="day"> <span>白金 · 日</span></label>
      <label class="loop-opt"><input type="radio" name="theme" value="night"> <span>黑金 · 夜</span></label>
    </div>
  </section>
  <section class="menu-section">
    <h3>循环模式</h3>
    <div class="loop-row">
      <label class="loop-opt"><input type="radio" name="loop" value="folder"> <span>顺序循环</span></label>
      <label class="loop-opt"><input type="radio" name="loop" value="single"> <span>单曲循环</span></label>
    </div>
  </section>
  <section class="menu-section">
    <h3>本地缓存</h3>
    <div id="usageNote" class="cache-info">—</div>
  </section>
  <details class="menu-section menu-debug">
    <summary>调试日志</summary>
    <div id="log"></div>
  </details>
</aside>

<audio id="audio" playsinline></audio>
<script type="module" src="./app.js"></script>
</body>
</html>
