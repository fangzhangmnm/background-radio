<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F6F4EF">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121110">
<title>Background Radio</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- play — 播放:实心右向三角 ▶(IEC 60417 磁带机惯例统一实心, 描边同色叠加得圆角); 20260819 media 批入库 -->

  <!-- pause — 暂停:双竖杠 ⏸(粗 3.2 圆帽, brush-width 同款加粗手法); 20260819 media 批入库 -->
  <symbol id="pause" data-cat="media" data-src="own" data-note="暂停:双竖杠 ⏸(粗 3.2 圆帽, brush-width 同款加粗手法); 20260819 media 批入库" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><g stroke-width="3.2"><path d="M8.3 5.5 V18.5"/><path d="M15.7 5.5 V18.5"/></g></symbol>

  <!-- common -->
  <!-- back — 返回:左向整箭头(带杆;裸 chevron-left 曾因小尺寸渲染差被 sunset) -->
  <symbol id="back" data-cat="common" data-src="own" data-note="返回:左向整箭头(带杆;裸 chevron-left 曾因小尺寸渲染差被 sunset)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H5"/><polyline points="11 6 5 12 11 18"/></symbol>

  <!-- refresh — 刷新:顺时针 3/4 圆 + 箭头(从 12 点绕到 9 点, 箭头尖在右上) -->
  <symbol id="refresh" data-cat="cloud" data-src="own" data-note="刷新:顺时针 3/4 圆 + 箭头(从 12 点绕到 9 点, 箭头尖在右上)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><!-- 顺时针 3/4 圆 + 箭头：从 12 点出发顺时针绕到 9 点；箭头尖在右上 --> <path d="M21 12a9 9 0 1 1-3.5-7.1"/> <polyline points="21 4 21 9 16 9"/></symbol>

  <symbol id="download" data-cat="cloud" data-src="feather:download" data-note="下载" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="3" x2="12" y2="15"/></symbol>

<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!-- BR 本地补丁 sprite（stopgap）：skip-prev / skip-next / volume 尚未进共享图标库（已登记 20260708 SVG Icons/TODO.md）。
       图形 = v1（仓根 index.html）已 ship 的人类认可版走带/喇叭图标，非新画。
       让位协议：build.sh 把本 sprite 内联在共享 sprite 之后——真图入库、重跑 extract 进主 sprite 后，同 id 先到先得自动让位；届时删掉这里对应的 symbol。 -->
  <symbol id="skip-prev" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="6" width="2" height="12"/><polygon points="20,6 9,12 20,18"/></symbol>
  <symbol id="skip-next" viewBox="0 0 24 24" fill="currentColor"><polygon points="4,6 15,12 4,18"/><rect x="17" y="6" width="2" height="12"/></symbol>
  <symbol id="volume" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 4V5L7 9H3zm12 0v6c1.66 0 3-1.34 3-3s-1.34-3-3-3z"/></symbol>
</svg>


<div class="shell">
  <header class="top-bar">
    <div class="status">
      <div id="nowTitle" class="status-track">Radio</div>
      <div id="statusScope" class="status-scope"></div>
    </div>
    <button id="refreshBtn" class="menu-btn icon-btn" aria-label="刷新列表" title="刷新列表"><svg class="ic"><use href="#refresh"/></svg></button>
    <button id="menuToggle" class="menu-btn" aria-label="菜单" title="菜单"><span></span><span></span><span></span></button>
  </header>

  <main>
    <section class="browser">
      <button id="resumeBtn" class="resume-row" hidden></button>
      <div id="status"></div>
      <div id="list" class="entry-list"></div>
    </section>

    <section class="seek">
      <span id="posCur" class="time">0:00</span>
      <div id="progressWrap" aria-label="进度"><div id="progressBar"></div></div>
      <span id="posDur" class="time">0:00</span>
    </section>

    <section class="controls">
      <div class="ctrl-col">
        <button id="rewindBtn" class="ctrl-cell" aria-label="回退 10 秒"><span class="ctrl-glyph">«</span><span class="ctrl-sub">10s</span></button>
        <button id="prevBtn" class="ctrl-cell" aria-label="上一曲"><svg class="ic"><use href="#skip-prev"/></svg></button>
      </div>
      <button id="bigPlay" class="ctrl-play-big" aria-label="播放/暂停"><svg class="ic-big"><use id="bigPlayIcon" href="#play"/></svg></button>
      <div class="ctrl-col">
        <button id="forwardBtn" class="ctrl-cell" aria-label="前进 30 秒"><span class="ctrl-glyph">»</span><span class="ctrl-sub">30s</span></button>
        <button id="nextBtn" class="ctrl-cell" aria-label="下一曲"><svg class="ic"><use href="#skip-next"/></svg></button>
      </div>
      <div class="vol-strip">
        <svg class="vol-icon ic"><use href="#volume"/></svg>
        <input type="range" id="volumeBar" class="vol-vert" min="0" max="100" value="80" step="1" orient="vertical" aria-label="音量">
      </div>
    </section>
  </main>
</div>

<div id="menuBackdrop" class="menu-backdrop" aria-hidden="true"></div>
<aside id="menuDrawer" class="menu-drawer" aria-hidden="true" aria-label="菜单">
  <header class="menu-head">
    <h2>菜单 <span id="ver"></span></h2>
    <button id="menuClose" class="menu-x" aria-label="关闭菜单">✕</button>
  </header>
  <section class="menu-section">
    <h3>账号</h3>
    <div id="cloudWho" class="user-name">未登录</div>
    <div class="menu-row"><button id="authBtn" class="ghost"><span id="authLabel">登录</span></button></div>
  </section>
  <section class="menu-section">
    <h3>循环模式</h3>
    <div class="loop-row">
      <label class="loop-opt"><input type="radio" name="loop" value="folder"> <span>顺序循环</span></label>
      <label class="loop-opt"><input type="radio" name="loop" value="single"> <span>单曲循环</span></label>
    </div>
  </section>
  <section class="menu-section">
    <h3>本地缓存</h3>
    <div id="usageNote" class="cache-info">—</div>
  </section>
  <details class="menu-section menu-debug">
    <summary>调试日志</summary>
    <div id="log"></div>
  </details>
</aside>

<audio id="audio" playsinline></audio>
<script type="module" src="./app.js"></script>
</body>
</html>
